<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">AWS VPC Peering Lab Architecture</title>
<desc id="desc">Two VPCs in the Mumbai AWS region connected by a VPC peering connection. VPC A has a public and a private subnet and an internet gateway. VPC B has a private subnet. Route tables on both sides route traffic through the peering connection.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58677c"/></marker>
  <style>
    .heading{font: bold 24px Arial,sans-serif;fill:#172b4d}
    .subheading{font: bold 18px Arial,sans-serif;fill:#172b4d}
    .label{font: 16px Arial,sans-serif;fill:#24364b}
    .small{font: 14px Arial,sans-serif;fill:#43556b}
    .vpc{fill:#f7faff;stroke:#3973ac;stroke-width:2.5}
    .node{fill:#e8f1ff;stroke:#3973ac;stroke-width:2}
    .route{fill:#fff2cc;stroke:#b38f00;stroke-width:2}
    .link{stroke:#58677c;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="heading">AWS VPC Peering Lab</text>
<text x="600" y="70" text-anchor="middle" class="small">AWS Region: ap-south-1 (Mumbai) • Terraform Infrastructure as Code</text>
<rect x="35" y="105" width="1130" height="495" rx="18" fill="#fbfcfe" stroke="#b7c5d6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="55" y="135" class="subheading">AWS Region</text>
<rect x="65" y="160" width="435" height="405" rx="15" class="vpc"/>
<text x="282" y="195" text-anchor="middle" class="subheading">VPC A — 10.10.0.0/16</text>
<rect x="95" y="220" width="175" height="78" rx="10" class="node"/>
<text x="182" y="249" text-anchor="middle" class="label">Internet Gateway</text>
<text x="182" y="274" text-anchor="middle" class="small">ewb-igw-a</text>
<rect x="295" y="220" width="175" height="78" rx="10" class="node"/>
<text x="382" y="248" text-anchor="middle" class="label">Public subnet</text>
<text x="382" y="273" text-anchor="middle" class="small">10.10.1.0/24</text>
<text x="382" y="289" text-anchor="middle" class="small">Optional bastion</text>
<path d="M270 259 L292 259" class="link"/>
<rect x="95" y="330" width="175" height="90" rx="10" class="node"/>
<text x="182" y="359" text-anchor="middle" class="label">Private subnet</text>
<text x="182" y="384" text-anchor="middle" class="small">10.10.2.0/24</text>
<text x="182" y="402" text-anchor="middle" class="small">Optional App-A</text>
<rect x="295" y="330" width="175" height="90" rx="10" class="route"/>
<text x="382" y="363" text-anchor="middle" class="label">Route tables</text>
<text x="382" y="388" text-anchor="middle" class="small">Public + private</text>
<path d="M270 375 L292 375" class="link"/>
<rect x="95" y="455" width="375" height="75" rx="10" class="route"/>
<text x="282" y="483" text-anchor="middle" class="label">Security groups</text>
<text x="282" y="507" text-anchor="middle" class="small">Restricted SSH and ICMP rules</text>
<rect x="725" y="160" width="410" height="405" rx="15" class="vpc"/>
<text x="930" y="195" text-anchor="middle" class="subheading">VPC B — 10.20.0.0/16</text>
<rect x="755" y="245" width="350" height="100" rx="10" class="node"/>
<text x="930" y="276" text-anchor="middle" class="label">Private subnet</text>
<text x="930" y="302" text-anchor="middle" class="small">10.20.1.0/24</text>
<text x="930" y="324" text-anchor="middle" class="small">Optional App-B</text>
<rect x="755" y="390" width="350" height="90" rx="10" class="route"/>
<text x="930" y="425" text-anchor="middle" class="label">Private route table</text>
<text x="930" y="451" text-anchor="middle" class="small">Route to VPC A via peering</text>
<path d="M930 345 L930 387" class="link"/>
<rect x="535" y="270" width="125" height="125" rx="15" class="route"/>
<text x="597" y="304" text-anchor="middle" class="label">VPC</text>
<text x="597" y="326" text-anchor="middle" class="label">Peering</text>
<text x="597" y="348" text-anchor="middle" class="label">Connection</text>
<text x="597" y="374" text-anchor="middle" class="small">ewb-a-b-peer</text>
<path d="M500 330 L532 330" class="link"/>
<path d="M660 330 L722 330" class="link"/>
<text x="600" y="440" text-anchor="middle" class="small">Routes are required on both VPC sides</text>
<text x="600" y="625" text-anchor="middle" class="small">EC2 instances are optional and disabled by default in this project</text>
</svg>
